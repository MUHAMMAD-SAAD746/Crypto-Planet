<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Planet</title>
    <link rel="shortcut icon" href="./assets/images/fav-icon.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/navbar.css">
    <link rel="stylesheet" href="./assets/css/footer.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/wallet-history.css">
</head>

<body>
    <div id="navbar"></div>

    <main class="main-body">
        <div class="row">
            <div class="col-12 col-left">
                <header id="portfolio-header" class="mb-4">
                    <div class="portfolio-top">
                        <div class="portfolio-info">
                            <h2 class="portfolio-title">Portfolio</h2>
                            <p class="portfolio-update">
                                Updated 16/02/2026 at 02:30 PM
                            </p>
                        </div>

                        <div class="portfolio-actions d-none d-md-flex">
                            <button class="portfolio-btn">
                                <ion-icon name="create-outline"></ion-icon>
                                <span>Edit</span>
                            </button>

                            <button class="portfolio-btn">
                                <ion-icon name="add-outline"></ion-icon>
                                <span>Create New Portfolio</span>
                            </button>
                        </div>

                        <div class="d-block d-md-none">
                            <ion-icon name="ellipsis-vertical"></ion-icon>
                        </div>
                    </div>

                    <div class="row portfolio-summary g-3">
                        <div class="col-12 col-lg-6 portfolio-item balance-item">
                            <p class="portfolio-label">
                                <ion-icon name="wallet-outline"></ion-icon>
                                <span>Available Balance</span>
                            </p>

                            <div class="d-flex align-items-center balance-content">
                                <h3 class="portfolio-value">
                                    $32,455.12
                                </h3>

                                <button class="hide-price-btn">
                                    <span>Hide Price</span>
                                    <ion-icon name="eye-off-outline"></ion-icon>
                                </button>
                            </div>
                        </div>


                        <div class="col-12 col-lg-6">
                            <div class="history-summary-card">
                                <div class="summary-item">
                                    <div class="summary-header">
                                        <ion-icon name="card-outline"></ion-icon>
                                        <span>Total Deposited</span>
                                    </div>

                                    <div class="summary-value">
                                        <ion-icon name="download-outline"></ion-icon>
                                        <span>$32,455.12</span>
                                    </div>
                                </div>

                                <div class="summary-item">
                                    <div class="summary-header">
                                        <ion-icon name="time-outline"></ion-icon>
                                        <span>Total Withdrawals</span>
                                    </div>

                                    <div class="summary-value">
                                        <ion-icon name="arrow-up-circle-outline"></ion-icon>
                                        <span>$2,000.12</span>
                                    </div>
                                </div>
                            </div>
                        </div>


                    </div>
                </header>
            </div>
            <div class="col-12 col-right"></div>
        </div>
    </main>

    <footer id="footer" class="p-0"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./components/navbar.js"></script>
    <script src="./components/footer.js"></script>


    <script>
        document.getElementById('navbar').innerHTML = loadNavbar();
        document.getElementById('footer').innerHTML = loadFooter();
        const footer = document.querySelector("footer");

        const navbar = document.querySelector(".navbar-custom");
        let isAuthenticated = true;

        if (isAuthenticated) {
            navbar.classList.add("authenticated");
            footer.classList.add("authenticated");
        }
    </script>

    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>

</html>
