<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Planet</title>
    <link rel="shortcut icon" href="./assets/images/fav-icon.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/navbar.css">
    <link rel="stylesheet" href="./assets/css/login.css">
</head>

<body>
    <nav class="navbar navbar-custom">
        <div>
            <img src="./assets/images/logo.PNG" alt="Logo">
        </div>
    </nav>

    <div class="auth-card">
        <main id="card">
            <h1>Create an Account</h1>

            <input type="email" placeholder="Email" name="" id="">
            <input type="password" placeholder="Password" name="" id="">
            <input type="password" placeholder="Confirm Password" name="" id="">

            <div class="agreement">
                <ion-icon name="checkmark-circle-outline"></ion-icon>
                <p>
                    By Register i agree that i'm 18 year of age or older, at the
                    <a href="#">User Agreements, Privacy Policy, Cookie Policy.</a>
                </p>
            </div>

            <button onclick="window.location.href='login.html'">Register</button>
            <p>Already have an account? <span><a href="login.html">Login</a></span></p>

            <p class="divider-text">or continue with</p>

            <div class="container-fluid">
                <div class="row">
                    <div class="social-icon">
                        <ion-icon name="logo-google"></ion-icon>
                    </div>
                    <div class="social-icon">
                        <ion-icon name="logo-apple"></ion-icon>
                    </div>
                    <div class="social-icon">
                        <ion-icon name="logo-facebook"></ion-icon>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>

</html>
